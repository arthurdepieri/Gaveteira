<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
  <title id="title">Gaveteira - modelo de ficha interna para Canva</title>
  <desc id="desc">Modelo da ficha interna da Gaveteira com fundo de arquivo, hero, capa, identidade, resumo, detalhes, linha do tempo e diario.</desc>
  <defs>
    <style>
      .label { font-family: Inter, Arial, sans-serif; font-weight: 800; letter-spacing: 0; }
      .body { font-family: Inter, Arial, sans-serif; letter-spacing: 0; }
      .title { font-family: Georgia, serif; font-weight: 800; letter-spacing: 0; }
    </style>
    <pattern id="archive-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#d8c7ad" stroke-width="1" opacity=".45"/>
    </pattern>
    <pattern id="note-lines" width="100" height="32" patternUnits="userSpaceOnUse">
      <rect width="100" height="32" fill="#fffaf1"/>
      <path d="M0 31H100" stroke="#eadbc6" stroke-width="1"/>
    </pattern>
  </defs>

  <g id="Fundo da ficha">
    <rect width="1120" height="900" rx="8" fill="#fffaf1" stroke="#d8c7ad"/>
    <rect width="1120" height="900" rx="8" fill="url(#archive-grid)" opacity=".5"/>
  </g>

  <g id="Hero">
    <rect x="16" y="16" width="1088" height="330" rx="8" fill="#fffdf8" stroke="#d8c7ad"/>
    <g id="Capa interna - vem da gaveta">
      <rect x="32" y="32" width="220" height="292" rx="8" fill="#78644b"/>
      <rect x="32" y="32" width="220" height="292" rx="8" fill="#223d50" opacity=".42"/>
      <rect x="32" y="32" width="220" height="292" rx="8" fill="none" stroke="#fffdf8" stroke-width="6"/>
      <text x="142" y="181" text-anchor="middle" fill="#fffaf1" font-size="42" class="label">CAPA</text>
      <text x="142" y="210" text-anchor="middle" fill="#fffaf1" font-size="13" class="body" opacity=".82">substituir</text>
    </g>

    <g id="Identidade">
      <rect x="270" y="42" width="128" height="34" rx="4" fill="#9f473d"/>
      <text x="334" y="64" text-anchor="middle" fill="#fffaf1" font-size="13" class="label">LENDO</text>
      <text x="270" y="136" fill="#211d18" font-size="58" class="title">O Atlas das Gavetas</text>
      <text x="270" y="178" fill="#6f6255" font-size="20" class="body">2026 / Fantasia documental / Modelo Admin</text>
      <text x="270" y="226" fill="#c38625" font-size="26" class="body">Nota 4.5/5</text>

      <g id="Chips de resumo">
        <rect x="270" y="254" width="82" height="30" rx="15" fill="#fff4da" stroke="#d8c7ad"/>
        <text x="311" y="274" text-anchor="middle" fill="#5a4028" font-size="12" class="label">2026</text>
        <rect x="360" y="254" width="172" height="30" rx="15" fill="#fff4da" stroke="#d8c7ad"/>
        <text x="446" y="274" text-anchor="middle" fill="#5a4028" font-size="12" class="label">Fantasia documental</text>
        <rect x="540" y="254" width="106" height="30" rx="15" fill="#e9f2df" stroke="#b9d7ca"/>
        <text x="593" y="274" text-anchor="middle" fill="#346b5d" font-size="12" class="label">AMIGOS</text>
      </g>
    </g>
  </g>

  <g id="Blocos internos">
    <g id="Resumo">
      <rect x="16" y="370" width="528" height="174" rx="8" fill="#fffdf8" stroke="#d8c7ad"/>
      <text x="36" y="416" fill="#70412f" font-size="24" class="title">Resumo</text>
      <text x="36" y="456" fill="#6f6255" font-size="18" class="body">Área para síntese pessoal, citações ou</text>
      <text x="36" y="482" fill="#6f6255" font-size="18" class="body">opinião final preservando a linguagem da ficha.</text>
    </g>

    <g id="Detalhes">
      <rect x="576" y="370" width="528" height="174" rx="8" fill="#fffdf8" stroke="#d8c7ad"/>
      <text x="596" y="416" fill="#70412f" font-size="24" class="title">Detalhes</text>
      <rect x="596" y="438" width="148" height="66" rx="8" fill="#fffaf1" stroke="#d8c7ad"/>
      <text x="612" y="462" fill="#6f6255" font-size="12" class="label">FORMATO</text>
      <text x="612" y="488" fill="#211d18" font-size="18" class="body">Outro</text>
      <rect x="764" y="438" width="148" height="66" rx="8" fill="#fffaf1" stroke="#d8c7ad"/>
      <text x="780" y="462" fill="#6f6255" font-size="12" class="label">PÁGINAS</text>
      <text x="780" y="488" fill="#211d18" font-size="18" class="body">144 / 320</text>
      <rect x="932" y="438" width="148" height="66" rx="8" fill="#fffaf1" stroke="#d8c7ad"/>
      <text x="948" y="462" fill="#6f6255" font-size="12" class="label">STATUS</text>
      <text x="948" y="488" fill="#211d18" font-size="18" class="body">Lendo</text>
    </g>

    <g id="Diario e linha do tempo">
      <rect x="16" y="574" width="1088" height="286" rx="8" fill="#fffaf1" stroke="#d8c7ad"/>
      <rect x="36" y="620" width="330" height="188" rx="8" fill="url(#note-lines)" stroke="#dec79b"/>
      <text x="56" y="654" fill="#70412f" font-size="22" class="title">Diário</text>
      <text x="56" y="694" fill="#6f6255" font-size="17" class="body">Notas, progresso, memória e</text>
      <text x="56" y="722" fill="#6f6255" font-size="17" class="body">impressões da ficha.</text>
      <rect x="396" y="620" width="330" height="188" rx="8" fill="#fffdf8" stroke="#d8c7ad"/>
      <text x="416" y="654" fill="#70412f" font-size="22" class="title">Linha do tempo</text>
      <circle cx="430" cy="700" r="7" fill="#c38625"/>
      <path d="M430 708V760" stroke="#d8c7ad" stroke-width="2"/>
      <circle cx="430" cy="768" r="7" fill="#346b5d"/>
      <text x="452" y="706" fill="#6f6255" font-size="16" class="body">Comecei</text>
      <text x="452" y="774" fill="#6f6255" font-size="16" class="body">Progresso</text>
      <rect x="756" y="620" width="328" height="188" rx="8" fill="#fffdf8" stroke="#d8c7ad"/>
      <text x="776" y="654" fill="#70412f" font-size="22" class="title">Selos</text>
      <rect x="776" y="688" width="92" height="28" rx="14" fill="#e9f2df" stroke="#b9d7ca"/>
      <text x="822" y="707" text-anchor="middle" fill="#346b5d" font-size="11" class="label">GAVETEIRA</text>
      <rect x="878" y="688" width="112" height="28" rx="14" fill="#e9f2df" stroke="#b9d7ca"/>
      <text x="934" y="707" text-anchor="middle" fill="#346b5d" font-size="11" class="label">DIÁRIO</text>
    </g>
  </g>
</svg>
